name: AI VISION WORKS Android APK
on:
  push:
    branches: [avw2-android]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AI_VISION_WORKS_2.0.0.apk
          TAG="avw2-android-v2.0.0-b${{ github.run_number }}"
          gh release create "$TAG" AI_VISION_WORKS_2.0.0.apk --prerelease --target "${{ github.sha }}" \
            --title "AI VISION WORKS 2 안드로이드 앱 (빌드 ${{ github.run_number }})" \
            --notes "사내 배포용 설치 파일입니다. 휴대폰에서 APK를 내려받아 설치하세요(출처를 알 수 없는 앱 설치 허용 필요). 처음 실행 시 회사 서버 주소를 입력합니다."
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 120 build.log > tail.txt || echo "no log" > tail.txt
          gh issue create --title "APK build failed (run ${{ github.run_number }})" --body-file tail.txt || true
